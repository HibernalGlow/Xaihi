  <title id="title">Xaihi 的机制：27 个 plugin-bundle 装进 DSH 宿主，由 xaihi-core 聚合成三条对外路由</title>
  <desc id="desc">克制的 MD3 Expressive 机制图：宿主与 bundle、xaihi-core、三条路由都用统一的 arch 面板；xaihi-core 后面只放一个 flower-8 形状作为焦点，没有多余形状堆叠。</desc>
