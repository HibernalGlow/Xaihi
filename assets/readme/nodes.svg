<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">23 个领域节点的版图：一颗六边形 = 一个 DSH plugin-bundle</title>
  <desc id="desc">按 nodeId 排列的 23 个节点。填充深浅表示该节点在 xaihi.node 清单里承诺的 action 数，格内数字就是 action 数，下方是清单声明的分类。99 个 action 合计，22 / 23 带 bin；findz 用虚线标出（唯一没有 CLI bin）；kisaki 用玫红描边标出原生 czkawka Rust 内核；shellect 用琥珀描边标出它声明的是 approval 而不是 danger。</desc>

  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DE6FE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5DE6FE" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5DE6FE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#0A1218"/>
  <polygon points="900,0 1200,0 1200,150 1010,300 880,220" fill="#5DE6FE" opacity="0.04"/>

