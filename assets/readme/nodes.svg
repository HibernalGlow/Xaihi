    <text x="56" y="94" font-size="40" fill="#DCECF3">27 个领域节点</text>
    <text x="392" y="94" font-size="20" fill="#8FA6BC">一颗六边形 = 一个合法 plugin-bundle</text>
  </g>
  <line x1="56" y1="116" x2="1144" y2="116" stroke="url(#rule)" stroke-width="1"/>

