# 节点插件自带一行：插件即 bundle。
#
# DSH 的 Plugins 页只管理声明了 dsh.bundle 的包（"a dependency without a bundle
# patch is refused before it installs"），所以每装一个节点就多一行，也能单独关掉
# 而不影响工作台其余部分。`id` 是 settings 命名空间，必须等于 package.json#xaihi.id。
- insert:
    - id: xaihi-hello
      name: '@hibernalglow/xaihi-hello'
      config:
        label: hello from xaihi
