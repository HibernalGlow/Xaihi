name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 干净检出：lib/ 与 dist/ 都不在版本控制里，产物必须由这一步重新生成。
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pins
      - run: pnpm check:skills
      # 面板只许经 ui-kit 上色：先跑尺的阳性对照（--self-check），再跑真文件。
      - run: pnpm check:panels
      # 顺序是有意的：typecheck 与 test:unit 都要读 node-sdk 的 d.ts，
      # 而 purity / bundle 两条闸门断言的是产物本身，所以 build 必须在它们前面。
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r --no-bail run test:unit
