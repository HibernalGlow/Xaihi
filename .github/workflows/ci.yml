name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 干净检出：lib/ 与 dist/ 都不在版本控制里，产物必须由这一步重新生成。
      - run: pnpm install --frozen-lockfile
      # 门禁清单与根 package.json 的 `test` 对齐（此前只跑前三条，vocab/vendored/两份注册表/
      # contract/nodebundle/cliface/tuiface 这几条只有本地能撞到，云上一直是空白）。
      - run: pnpm check:pins
      - run: pnpm check:skills
      # bundle 包不许带 workspace:* 运行时依赖（file: 安装会在解析依赖树时被拒）。
      - run: pnpm check:installable
      # check:vocab 不上云：它比的是**本机**那份上游参照仓（node-definitions 的绝对路径），
      # 云上读不到就自己报「尺失效，不是没问题」并红（run 38210769465 实测）。它留在根 test 里给本地用。
      - run: pnpm check:vendored
      - run: pnpm check:cliregistry
      - run: pnpm check:noderegistry
      # 签进来的预编原生件（21 MB / 37 MB 那两份）以前没有任何账：清单说在就得在，尺寸与 sha256 要对得上，
      # 盘上多出一条没记账的文件也要红。
      - run: pnpm check:nativemanifest
      - run: pnpm test:contract
      # 顺序是有意的：typecheck 与 test:unit 都要读 node-sdk 的 d.ts，
      # 而 purity / bundle 两条闸门断言的是产物本身，所以 build 必须在它们前面。
      - run: pnpm -r run build
      - run: pnpm check:nodebundle
      - run: pnpm check:cliface
      - run: pnpm check:tuiface
      # 别名表在运行时按 import.meta.dirname 现算，本身可移植；但 `tsconfig.ported.json` 的 paths 是
      # `build-aliases.mjs --write` 写进去的**绝对路径**（main 那份 107 条全是本机路径）⇒ 照抄到 runner 上
      # 就指向不存在的目录，`tsc -p tsconfig.ported.json` 会红在解析而不是红在类型。
      # 在检出里重新生成一次再量类型；改的只是 runner 那份临时检出，不进仓。
      # （根治是让生成器写相对路径，但 build-aliases.mjs 此刻正在别人那条未提交的 lane 上，不顺手改。）
      - run: node packages/ui-host/build-aliases.mjs --write
      - run: pnpm -r run typecheck
      - run: pnpm -r --no-bail run test:unit
